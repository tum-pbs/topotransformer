target: topotransformer.data.MultiDataModule
params:
  path_index: ${paths.PBDL_index}
  dataset_names: ['cfd-train-10k_cfd-test-threeOutlet-500']

  dataset_type: 'CUSTOM'
  unrolling_steps: ${unrolling_steps}
  test_unrolling_steps: ${test_unrolling_steps}
  batch_size: ${batch_size}
  num_workers: 8
  cache_strategy: 'none'
  different_resolution_strategy: 'none'
  normalize_data: 'mean-std'
  normalize_const: 'mean-std'
  downsample_factor: 1
  max_channels: 1
  sel_channels_input: ${sel_channels_input}
  sel_channels_target: ${sel_channels_target}
  normalize_target: ${normalize_target}
  max_constants: 5

